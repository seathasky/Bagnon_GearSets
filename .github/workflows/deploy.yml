name: Release AddOn

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        default: v1.0.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Package and Deploy
        uses: BigWigsMods/packager@v2
        with:
          args: -p ${{ vars.CURSEFORGE_PROJECT_ID || '0' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save packaged addon
        uses: actions/upload-artifact@v4
        with:
          name: Bagnon_GearSets
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
